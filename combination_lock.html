<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Combination Lock</title>
<style>
  :root {
    --metal: #b9c0c6;
    --metal-dark: #7d848a;
    --metal-darker: #5a6167;
    --body-color: #3f6fa6;
    --body-dark: #2d5280;
    --gold: #d4af37;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(circle at 50% 30%, #2b2f36, #14161a 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  h1 {
    color: #e8e8e8;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin: 0;
    opacity: 0.85;
  }

  .lock-wrap {
    position: relative;
    width: 340px;
    height: 400px;
  }

  /* Shackle */
  .shackle {
    position: absolute;
    top: 0;
    left: 70px;
    width: 200px;
    height: 190px;
    border: 28px solid var(--metal);
    border-bottom: none;
    border-radius: 100px 100px 0 0;
    background: transparent;
    box-shadow: inset 0 4px 6px rgba(255,255,255,0.5),
                inset 0 -4px 6px rgba(0,0,0,0.25),
                2px 0 3px rgba(0,0,0,0.3);
    transition: transform 0.6s cubic-bezier(.34,1.56,.64,1), top 0.6s cubic-bezier(.34,1.56,.64,1);
    z-index: 1;
    transform-origin: left bottom;
  }

  .lock-wrap.open .shackle {
    transform: translateX(-18px) rotate(-35deg);
    top: -14px;
  }

  /* Body */
  .body {
    position: absolute;
    top: 140px;
    left: 0;
    width: 340px;
    height: 260px;
    background: linear-gradient(180deg, var(--body-color) 0%, var(--body-dark) 100%);
    border-radius: 22px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5),
                inset 0 2px 4px rgba(255,255,255,0.25),
                inset 0 -6px 10px rgba(0,0,0,0.3);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 26px;
  }

  .brand {
    color: rgba(255,255,255,0.55);
    font-size: 11px;
    letter-spacing: 3px;
    margin-bottom: 18px;
    text-transform: uppercase;
  }

  .dials {
    display: flex;
    gap: 10px;
    background: var(--metal-darker);
    padding: 10px 14px;
    border-radius: 12px;
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.6), 0 2px 2px rgba(255,255,255,0.08);
  }

  .dial {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .arrow-btn {
    width: 40px;
    height: 26px;
    background: linear-gradient(180deg, #e2e6e9, #aab1b7);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 2px 3px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: transform 0.08s;
  }
  .arrow-btn:active { transform: translateY(1px); }
  .arrow-btn svg { width: 14px; height: 14px; fill: #3a3f44; }

  .digit-window {
    width: 46px;
    height: 62px;
    background: #111;
    border-radius: 5px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 6px rgba(0,0,0,0.9), 0 0 0 2px #000;
    cursor: ns-resize;
  }

  .digit-track {
    position: absolute;
    left: 0;
    width: 100%;
    transition: transform 0.28s cubic-bezier(.2,.9,.3,1.2);
  }

  .digit {
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 700;
    color: #ffcf4d;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 6px rgba(255,207,77,0.35);
  }

  .status {
    margin-top: 22px;
    height: 24px;
    font-size: 14px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.75);
  }

  .status.success { color: #7CFC9A; font-weight: 600; }
  .status.error { color: #ff8080; }

  .controls {
    display: flex;
    gap: 12px;
    margin-top: 4px;
  }

  button.action {
    background: linear-gradient(180deg, #4a4f56, #2e3237);
    color: #eee;
    border: 1px solid #55595e;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  button.action:hover { background: linear-gradient(180deg, #565c64, #383c42); }
  button.action:active { transform: translateY(1px); }

  .hint {
    color: rgba(255,255,255,0.35);
    font-size: 12px;
    text-align: center;
    max-width: 320px;
    line-height: 1.5;
  }

  .keyhole {
    display: none;
  }
</style>
</head>
<body>

<div class="stage">
  <h1>Set the Combination</h1>

  <div class="lock-wrap" id="lockWrap">
    <div class="shackle"></div>
    <div class="body">
      <div class="brand">Turn to Unlock</div>
      <div class="dials" id="dials"></div>
      <div class="status" id="status">Target: 1 2 3 4</div>
    </div>
  </div>

  <div class="controls">
    <button class="action" id="checkBtn">Try Combination</button>
    <button class="action" id="randomBtn">New Random Code</button>
    <button class="action" id="resetBtn">Reset Dials</button>
  </div>

  <div class="hint">Scroll, drag, or use the arrow buttons on each dial to change its digit. Click "Try Combination" to see if the lock opens.</div>
</div>

<script>
(function () {
  const NUM_DIALS = 4;
  const dialsEl = document.getElementById('dials');
  const statusEl = document.getElementById('status');
  const lockWrap = document.getElementById('lockWrap');

  let target = [1, 2, 3, 4];
  let values = [0, 0, 0, 0];
  let unlocked = false;

  function buildTrack(track, value) {
    // build a 0-9 looped strip, positioned so `value` is centered
    track.innerHTML = '';
    for (let i = -1; i <= 10; i++) {
      const d = document.createElement('div');
      d.className = 'digit';
      d.textContent = ((i % 10) + 10) % 10;
      track.appendChild(d);
    }
    positionTrack(track, value);
  }

  function positionTrack(track, value) {
    // offset by 1 (for the leading -1 filler row), each row 62px
    track.style.transform = `translateY(${-(value + 1) * 62}px)`;
  }

  function makeDial(index) {
    const dial = document.createElement('div');
    dial.className = 'dial';

    const up = document.createElement('button');
    up.className = 'arrow-btn';
    up.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 6l8 10H4z"/></svg>';

    const win = document.createElement('div');
    win.className = 'digit-window';
    const track = document.createElement('div');
    track.className = 'digit-track';
    win.appendChild(track);

    const down = document.createElement('button');
    down.className = 'arrow-btn';
    down.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 8h16l-8 10z"/></svg>';

    function change(delta) {
      values[index] = ((values[index] + delta) % 10 + 10) % 10;
      positionTrack(track, values[index]);
      if (unlocked) relock();
      clearStatus();
    }

    up.addEventListener('click', () => change(1));
    down.addEventListener('click', () => change(-1));

    // scroll wheel
    win.addEventListener('wheel', (e) => {
      e.preventDefault();
      change(e.deltaY > 0 ? -1 : 1);
    }, { passive: false });

    // drag
    let dragging = false, startY = 0, startVal = 0, accum = 0;
    win.addEventListener('mousedown', (e) => {
      dragging = true; startY = e.clientY; startVal = values[index]; accum = 0;
      document.body.style.cursor = 'ns-resize';
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const dy = startY - e.clientY;
      const steps = Math.trunc(dy / 20);
      if (steps !== accum) {
        const delta = steps - accum;
        accum = steps;
        values[index] = ((startVal + steps) % 10 + 10) % 10;
        positionTrack(track, values[index]);
        if (unlocked) relock();
        clearStatus();
      }
    });
    window.addEventListener('mouseup', () => {
      if (dragging) { dragging = false; document.body.style.cursor = ''; }
    });

    // touch support
    let touchStartY = 0, touchStartVal = 0, touchAccum = 0;
    win.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
      touchStartVal = values[index];
      touchAccum = 0;
    }, { passive: true });
    win.addEventListener('touchmove', (e) => {
      const dy = touchStartY - e.touches[0].clientY;
      const steps = Math.trunc(dy / 20);
      if (steps !== touchAccum) {
        touchAccum = steps;
        values[index] = ((touchStartVal + steps) % 10 + 10) % 10;
        positionTrack(track, values[index]);
        if (unlocked) relock();
        clearStatus();
      }
    }, { passive: true });

    dial.appendChild(up);
    dial.appendChild(win);
    dial.appendChild(down);
    dialsEl.appendChild(dial);
    buildTrack(track, values[index]);
  }

  for (let i = 0; i < NUM_DIALS; i++) makeDial(i);

  function clearStatus() {
    statusEl.className = 'status';
    statusEl.textContent = `Target: ${target.join(' ')}`;
  }

  function relock() {
    unlocked = false;
    lockWrap.classList.remove('open');
  }

  function checkCombo() {
    const match = values.every((v, i) => v === target[i]);
    if (match) {
      unlocked = true;
      lockWrap.classList.add('open');
      statusEl.textContent = 'Unlocked!';
      statusEl.className = 'status success';
    } else {
      lockWrap.classList.remove('open');
      statusEl.textContent = 'Incorrect combination';
      statusEl.className = 'status error';
    }
  }

  function randomize() {
    target = Array.from({ length: NUM_DIALS }, () => Math.floor(Math.random() * 10));
    relock();
    clearStatus();
  }

  function resetDials() {
    values = values.map(() => 0);
    document.querySelectorAll('.digit-track').forEach((t, i) => positionTrack(t, values[i]));
    relock();
    clearStatus();
  }

  document.getElementById('checkBtn').addEventListener('click', checkCombo);
  document.getElementById('randomBtn').addEventListener('click', randomize);
  document.getElementById('resetBtn').addEventListener('click', resetDials);

  clearStatus();
})();
</script>

</body>
</html>
